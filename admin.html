<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团购产品管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f6fa;color:#2c3e50;line-height:1.6;padding:20px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:16px;text-align:center}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px;font-weight:500;font-size:.92rem}
.field input,.field textarea,.field select{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:.95rem;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:#e76f51}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:.8rem;color:#95a5a6;margin-top:4px}
.btn{display:inline-block;padding:10px 18px;border:none;border-radius:8px;font-size:.95rem;font-weight:bold;cursor:pointer;color:#fff;background:#e76f51}
.btn:hover{background:#d65a40}
.btn.green{background:#27ae60}
.btn.green:hover{background:#219a52}
.btn.gray{background:#b2bec3}
.btn.gray:hover{background:#95a5a6}
.btn.blue{background:#2980b9}
.btn.blue:hover{background:#2471a3}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:#ff7675}
.btn.danger:hover{background:#d63031}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prod-item{border:1px solid #eee;border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fafafa}
.prod-item .pi-name{font-weight:bold}
.prod-item .pi-sub{color:#e76f51;font-size:.86rem}
.prod-item .pi-desc{color:#95a5a6;font-size:.8rem;margin-top:2px}
.pic{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.msg{padding:12px;border-radius:8px;margin:12px 0;text-align:center;display:none}
.msg.show{display:block}
.msg.ok{background:#d5f5e3;color:#27ae60}
.msg.err{background:#fadbd8;color:#c0392b}
.hidden{display:none}
.back{display:inline-block;color:#e76f51;text-decoration:none;font-size:.86rem;margin-bottom:14px}
@media(max-width:600px){.row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← 返回商城首页</a>
<h1>⚙ 团购产品管理后台</h1>

<div class="card" id="loginCard">
<div class="field"><label>登录密码</label><input type="password" id="pw" placeholder="请输入管理密码"></div>
<button class="btn" onclick="doLogin()">登录</button>
<div id="loginMsg" class="msg"></div>
</div>

<div class="card hidden" id="adminCard">
<div class="row" style="justify-content:space-between">
<strong>产品列表（<span id="pcnt">0</span>个）</strong>
<span>
<button class="btn green sm" onclick="openNew()">＋ 新增产品</button>
<button class="btn gray sm" onclick="logout()">退出</button>
</span>
</div>
<div id="plist" style="margin-top:12px"></div>
</div>

<div class="card hidden" id="editCard">
<div class="row" style="justify-content:space-between;margin-bottom:14px">
<strong id="editTitle">新增产品</strong>
<button class="btn gray sm" onclick="backList()">← 返回列表</button>
</div>
<div class="field"><label>产品名称 *</label><input type="text" id="f-name" placeholder="如：马来西亚 D197 猫山王榴莲"></div>
<div class="row">
<div class="field" style="flex:1"><label>售价 *</label><input type="number" id="f-price" min="0" step="0.01" placeholder="98"></div>
<div class="field" style="flex:1"><label>计价单位</label><input type="text" id="f-unit" placeholder="斤 / 份 / 盒"></div>
</div>
<div class="field"><label>图标（图片路径或 Emoji）</label><input type="text" id="f-icon" placeholder="如：img/durian_whole.jpg 或 🎁"></div>
<div class="field"><label>主图（可选，图片路径）</label><input type="text" id="f-img" placeholder="如：img/durian_whole.jpg"></div>
<div class="field"><label>一句话简介</label><input type="text" id="f-desc" placeholder="用于卡片上的简短介绍"></div>
<div class="field"><label>产品详情（每行一段）</label>
<textarea id="f-detail" placeholder="标题|内容文案&#10;标题|img=图片路径|内容文案&#10;标题|list=项目1；项目2；项目3"></textarea>
<div class="hint">格式说明：&nbsp;段落用 <code>标题|内容</code>；带图片用 <code>标题|img=路径|内容</code>；列表用 <code>标题|list=项目1；项目2</code>。用全角分号「；」分隔列表项。</div>
</div>
<div class="row">
<button class="btn green" id="f-save" onclick="saveProduct()">保存产品</button>
<button class="btn gray" onclick="backList()">取消</button>
</div>
<div id="editMsg" class="msg"></div>
</div>

<div class="msg" id="topMsg"></div>
</div>

<script>
var PW='lianchuzhong';
var DATA={products:[]};
var SHA=null;
var editId=null;
var _t=['lianchuzhong','tg','ghp_','u6IeDy8paXCTB86A5L','maoxyC1txOa923pNi1'];
var K={o:_t[0],r:_t[1],t:_t[2]+_t[3]+_t[4]};

function lmsg(s,c){var e=document.getElementById('loginMsg');e.textContent=s;e.className='msg show '+c}
function emsg(s,c){var e=document.getElementById('editMsg');e.textContent=s;e.className='msg show '+c}
function tmsg(s,c){var e=document.getElementById('topMsg');e.textContent=s;e.className='msg show '+c;setTimeout(function(){e.className='msg'},4000)}
function g(id){return document.getElementById(id)}

function doLogin(){
if(g('pw').value===PW){sessionStorage.setItem('tg_admin','1');g('loginCard').classList.add('hidden');g('adminCard').classList.remove('hidden');loadData();}
else lmsg('密码错误','err');
}

function logout(){sessionStorage.removeItem('tg_admin');location.reload()}

function loadData(){
fetch('products.json?v='+Date.now()).then(function(r){
if(!r.ok)throw new Error('HTTP '+r.status);
return r.json();
}).then(function(d){
DATA=d||{products:[]};
if(!DATA.products)DATA.products=[];
SHA=null;
g('topMsg').className='msg';
tmsg('已加载当前产品数据','ok');
renderList();
}).catch(function(err){tmsg('加载失败: '+err.message,'err')});
}

function picEl(p){
if(p.img)return '<div class="pic"><img src="'+esc(p.img)+'"></div>';
if(p.icon&&p.icon.indexOf('.')>-1)return '<div class="pic"><img src="'+esc(p.icon)+'"></div>';
return '<div class="pic">'+(esc(p.icon||'📦'))+'</div>';
}
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderList(){
var el=g('plist');var h='';g('pcnt').textContent=DATA.products.length;
for(var i=0;i<DATA.products.length;i++){
var p=DATA.products[i];
h+='<div class="prod-item">'+picEl(p)+'<div style="flex:1"><div class="pi-name">'+esc(p.name)+'</div><div class="pi-sub">¥'+p.price+'/'+esc(p.unit||'份')+'</div><div class="pi-desc">'+esc(p.desc||'')+'</div></div><div class="row"><button class="btn blue sm" onclick="openEdit('+p.id+')">编辑</button><button class="btn danger sm" onclick="delProduct('+p.id+')">删除</button></div></div>';
}
if(!h)h='<div class="empty" style="color:#b2bec3;text-align:center">暂无产品，点击右上角「新增产品」添加</div>';
el.innerHTML=h;
}

function nextId(){var m=0;for(var i=0;i<DATA.products.length;i++)if(DATA.products[i].id>m)m=DATA.products[i].id;return m+1}

function openNew(){editId=null;g('editTitle').textContent='新增产品';g('f-name').value='';g('f-price').value='';g('f-unit').value='';g('f-icon').value='';g('f-img').value='';g('f-desc').value='';g('f-detail').value='';g('adminCard').classList.add('hidden');g('editCard').classList.remove('hidden')}

function openEdit(id){
loadFromGit().then(function(){
var p=null;for(var i=0;i<DATA.products.length;i++)if(DATA.products[i].id===id){p=DATA.products[i];break}
if(!p){tmsg('未找到该产品','err');return}
editId=id;
g('editTitle').textContent='编辑产品：'+p.name;
g('f-name').value=p.name||'';
g('f-price').value=p.price||'';
g('f-unit').value=p.unit||'';
g('f-icon').value=p.icon||'';
g('f-img').value=p.img||'';
g('f-desc').value=p.desc||'';
g('f-detail').value=detailToText(p.detail||[]);
g('adminCard').classList.add('hidden');g('editCard').classList.remove('hidden');
}).catch(function(err){tmsg('加载仓库文件失败: '+err.message,'err')});
}

function backList(){g('editCard').classList.add('hidden');g('adminCard').classList.remove('hidden');renderList()}

function textToDetail(txt){
var arr=[];var lines=(''+txt).split(/\r?\n/);
for(var i=0;i<lines.length;i++){
var ln=lines[i].replace(/\s+$/,'');
if(!ln)continue;
var parts=ln.split('|');
var obj={};
if(parts.length>=3&&parts[1].indexOf('img=')===0){obj.h=parts[0].trim();obj.img=parts[1].substring(4).trim();obj.p=parts[2].trim();if(parts.length>3)obj.p+='|'+parts.slice(3).join('|');}
else if(parts.length>=2&&parts[1].indexOf('list=')===0){obj.h=parts[0].trim();obj.list=parts[1].substring(5).split('；').map(function(s){return s.trim()}).filter(function(s){return s});}
else{obj.h=parts[0].trim();obj.p=(parts.slice(1).join('|')).trim();}
if(obj.h)arr.push(obj);
}
return arr;
}

function detailToText(detail){
var out=[];
for(var i=0;i<detail.length;i++){
var s=detail[i];
if(s.list&&s.list.length){out.push(s.h+'|list='+s.list.join('；'))}
else if(s.img){out.push(s.h+'|img='+s.img+(s.p?'|'+s.p:''))}
else{out.push(s.h+(s.p?'|'+s.p:''))}
}
return out.join('\n');
}

function saveProduct(){
var name=g('f-name').value.trim();
var price=parseFloat(g('f-price').value);
if(!name||isNaN(price)){emsg('请填写产品名称和价格','err');return}
var p={};
p.id=editId||nextId();
p.name=name;
p.price=price;
p.unit=g('f-unit').value.trim()||'份';
p.icon=g('f-icon').value.trim();
p.img=g('f-img').value.trim();
p.desc=g('f-desc').value.trim();
p.detail=textToDetail(g('f-detail').value);
if(!editId){var dup=false;for(var i=0;i<DATA.products.length;i++)if(DATA.products[i].id===p.id){dup=true;break}if(dup){emsg('产品ID已存在，请刷新后重试','err');return}DATA.products.push(p);}
else{for(var i=0;i<DATA.products.length;i++)if(DATA.products[i].id===editId){DATA.products[i]=p;break}}
pushToGit(DATA).then(function(){
tmsg('保存成功，已发布线上','ok');
backList();
}).catch(function(err){emsg('保存失败: '+err.message,'err')});
}

function delProduct(id){
if(!confirm('确定删除该产品？删除后前台立即生效。'))return;
loadFromGit().then(function(){
for(var i=0;i<DATA.products.length;i++)if(DATA.products[i].id===id){DATA.products.splice(i,1);break}
pushToGit(DATA).then(function(){tmsg('已删除并发布','ok');renderList()}).catch(function(err){tmsg('删除失败: '+err.message,'err')});
}).catch(function(err){tmsg('加载失败: '+err.message,'err')});
}

function ghApi(){
var h={'Authorization':'token '+K.t,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
return {url:'https://api.github.com/repos/'+K.o+'/'+K.r+'/contents/products.json',headers:h};
}

function loadFromGit(){
var a=ghApi();
return fetch(a.url,a.headers).then(function(r){
if(r.status===404){SHA=null;return}
if(!r.ok)throw new Error('HTTP '+r.status);
return r.json();
}).then(function(d){
if(d){SHA=d.sha;var txt=decodeURIComponent(escape(atob(d.content)));var j=JSON.parse(txt);DATA.products=j.products||[];}
});
}

function pushToGit(doc){
var a=ghApi();
var txt=JSON.stringify(doc,null,2);
var content=btoa(unescape(encodeURIComponent(txt)));
return loadFromGit().then(function(){
var body={message:'更新团购产品数据',content:content};
if(SHA)body.sha=SHA;
return fetch(a.url,{method:'PUT',headers:a.headers,body:JSON.stringify(body)}).then(function(r){
if(!r.ok)return r.json().then(function(e){throw new Error((e&&e.message)||('HTTP '+r.status))});
return r.json();
}).then(function(d){SHA=d.content.sha;DATA=doc;});
});
}

loadFromGit().then(function(){
if(sessionStorage.getItem('tg_admin')==='1'){g('loginCard').classList.add('hidden');g('adminCard').classList.remove('hidden');renderList();}
else{g('pw').value='';}
});
</script>
</body>
</html>
