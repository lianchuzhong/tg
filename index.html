<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团购预售</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f6fa;color:#2c3e50;line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
header{background:#fff;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:30px;text-align:center}
h1{color:#2d3436;font-size:2rem}
h2{color:#2d3436;margin:20px 0;text-align:center}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}
.product{background:#fff;border-radius:10px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.1);text-align:center}
.product .icon{font-size:3rem;margin-bottom:10px}
.product .name{font-size:1.2rem;font-weight:bold;margin-bottom:5px}
.product .price{color:#e76f51;font-weight:bold;font-size:1.3rem;margin-bottom:5px}
.product .desc{color:#636e72;font-size:.85rem;margin-bottom:15px}
.qty-row{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:10px}
.qty-row button{width:40px;height:40px;border:2px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:1.5rem;font-weight:bold}
.qty-row button:hover{background:#e76f51;color:#fff;border-color:#e76f51}
.qty-row span{font-size:1.5rem;font-weight:bold;min-width:40px;text-align:center}
.add-btn{width:100%;padding:12px;background:#27ae60;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:bold}
.add-btn:hover{background:#219a52}
.cart{background:#fff;padding:25px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:30px}
.empty{text-align:center;color:#b2bec3;padding:20px}
.item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #eee}
.item-info .item-name{font-weight:bold;font-size:1.1rem}
.item-info .item-sub{color:#e76f51;font-size:1rem}
.item-ops{display:flex;align-items:center;gap:10px}
.item-ops button{width:35px;height:35px;border:2px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:1.2rem}
.item-ops button:hover{background:#e76f51;color:#fff;border-color:#e76f51}
.item-ops .num{font-weight:bold;font-size:1.1rem;min-width:30px;text-align:center}
.item-ops .del{background:#ff7675;color:#fff;border:none;padding:8px 15px;border-radius:8px}
.item-ops .del:hover{background:#d63031}
.total{text-align:right;font-size:1.5rem;font-weight:bold;padding-top:15px;border-top:2px solid #eee;margin-top:15px;color:#e76f51}
.form{background:#fff;padding:30px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.field{margin-bottom:20px}
.field label{display:block;margin-bottom:8px;font-weight:500}
.field input,.field textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:1rem}
.field input:focus,.field textarea:focus{outline:none;border-color:#e76f51}
.field textarea{min-height:80px;resize:vertical}
.submit{width:100%;padding:15px;background:#e76f51;color:#fff;border:none;border-radius:8px;font-size:1.2rem;cursor:pointer;font-weight:bold}
.submit:hover{background:#d65a40}
.msg{padding:15px;border-radius:8px;margin:15px 0;text-align:center;display:none}
.msg.show{display:block}
.msg.ok{background:#d5f5e3;color:#27ae60}
.msg.err{background:#fadbd8;color:#c0392b}
</style>
</head>
<body>
<div class="container">
<header><h1>团购预售</h1></header>
<h2>选择产品</h2>
<div class="products">
<div class="product">
<div class="icon">📦</div>
<div class="name">经典团购套餐</div>
<div class="price">¥199</div>
<div class="desc">限时优惠，专为团购设计的基础套餐</div>
<div class="qty-row">
<button onclick="sel(1,-1)">−</button>
<span id="q1">0</span>
<button onclick="sel(1,1)">+</button>
</div>
<button class="add-btn" onclick="add(1,'经典团购套餐',199)">加入预订</button>
</div>
<div class="product">
<div class="icon">🎁</div>
<div class="name">尊享团购套餐</div>
<div class="price">¥299</div>
<div class="desc">高端团购套餐，包含额外福利</div>
<div class="qty-row">
<button onclick="sel(2,-1)">−</button>
<span id="q2">0</span>
<button onclick="sel(2,1)">+</button>
</div>
<button class="add-btn" onclick="add(2,'尊享团购套餐',299)">加入预订</button>
</div>
<div class="product">
<div class="icon">👑</div>
<div class="name">终极团购套餐</div>
<div class="price">¥399</div>
<div class="desc">完整团购套餐，所有功能包含</div>
<div class="qty-row">
<button onclick="sel(3,-1)">−</button>
<span id="q3">0</span>
<button onclick="sel(3,1)">+</button>
</div>
<button class="add-btn" onclick="add(3,'终极团购套餐',399)">加入预订</button>
</div>
</div>

<div class="cart">
<h2>确认购物车</h2>
<div id="cc"><div class="empty">购物车为空，请先选择产品</div></div>
</div>

<div class="form">
<h2>填写收货信息</h2>
<form id="of">
<div class="field"><label>姓名 *</label><input type="text" id="n" required placeholder="请输入收货人姓名"></div>
<div class="field"><label>电话 *</label><input type="tel" id="p" required placeholder="请输入联系电话"></div>
<div class="field"><label>邮箱 *</label><input type="email" id="e" required placeholder="请输入邮箱地址"></div>
<div class="field"><label>收货地址 *</label><input type="text" id="a" required placeholder="请输入详细收货地址"></div>
<div class="field"><label>留言</label><textarea id="m" placeholder="其他要求或备注"></textarea></div>
<button type="submit" class="submit" id="sb">提交订单</button>
</form>
<div id="sm" class="msg"></div>
</div>
</div>

<script>
var C=[];
var S={1:0,2:0,3:0};
var _t=['lianchuzhong','tg-new','ghp_','u6IeDy8paXCTB86A5L','maoxyC1txOa923pNi1'];
var K={o:_t[0],r:_t[1],t:_t[2]+_t[3]+_t[4]};

function sel(id,d){S[id]+=d;if(S[id]<0)S[id]=0;document.getElementById('q'+id).textContent=S[id]}

function add(id,name,price){
var q=S[id];if(q<=0)q=1;
for(var i=0;i<C.length;i++){
if(C[i].id===id){C[i].q+=q;save();draw();S[id]=0;document.getElementById('q'+id).textContent=0;alert('已加入: '+name+' x'+q);return}
}
C.push({id:id,name:name,price:price,q:q});
save();draw();
S[id]=0;document.getElementById('q'+id).textContent=0;
alert('已加入: '+name+' x'+q)
}

function cq(id,d){
for(var i=0;i<C.length;i++){
if(C[i].id===id){C[i].q+=d;if(C[i].q<=0)C.splice(i,1);save();draw();return}
}
}

function di(id){for(var i=0;i<C.length;i++){if(C[i].id===id){C.splice(i,1);save();draw();return}}}

function draw(){
var el=document.getElementById('cc');
if(C.length===0){el.innerHTML='<div class="empty">购物车为空，请先选择产品</div>';return}
var h='';var t=0;
for(var i=0;i<C.length;i++){
var x=C[i];var s=x.price*x.q;t+=s;
h+='<div class="item">';
h+='<div class="item-info"><div class="item-name">'+x.name+'</div><div class="item-sub">¥'+x.price+' × '+x.q+' = ¥'+s+'</div></div>';
h+='<div class="item-ops">';
h+='<button onclick="cq('+x.id+',-1)">−</button>';
h+='<span class="num">'+x.q+'</span>';
h+='<button onclick="cq('+x.id+',1)">+</button>';
h+='<button class="del" onclick="di('+x.id+')">删除</button>';
h+='</div></div>'
}
h+='<div class="total">合计: ¥'+t+'</div>';
el.innerHTML=h
}

function msg(txt,cls){
var el=document.getElementById('sm');
el.textContent=txt;el.className='msg show '+cls;
setTimeout(function(){el.className='msg'},5000)
}

function ld(){try{var s=localStorage.getItem('tg');if(s)C=JSON.parse(s)}catch(e){}draw()}
function save(){try{localStorage.setItem('tg',JSON.stringify(C))}catch(e){}}

document.getElementById('of').onsubmit=function(e){
e.preventDefault();
var n=document.getElementById('n').value.trim();
var p=document.getElementById('p').value.trim();
var em=document.getElementById('e').value.trim();
var ad=document.getElementById('a').value.trim();
var ms=document.getElementById('m').value.trim();
if(!n||!p||!em||!ad){msg('请填写所有必填字段','err');return}
if(C.length===0){msg('请先加入至少一个预订产品','err');return}
var b=document.getElementById('sb');b.textContent='提交中...';b.disabled=true;
var ct='';var tot=0;
for(var i=0;i<C.length;i++){var s=C[i].price*C[i].q;tot+=s;ct+='  - '+C[i].name+' ¥'+C[i].price+' ×'+C[i].q+' = ¥'+s+'\n'}
ct+='  合计: ¥'+tot;
var bd='**预订人信息:**\n  - 姓名: '+n+'\n  - 电话: '+p+'\n  - 邮箱: '+em+'\n  - 地址: '+ad+'\n  - 留言: '+(ms||'无')+'\n\n**预订产品:**\n'+ct+'\n\n**提交时间:** '+new Date().toLocaleString();
fetch('https://api.github.com/repos/'+K.o+'/'+K.r+'/issues',{
method:'POST',
headers:{'Authorization':'token '+K.t,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
body:JSON.stringify({title:'新团购预售: '+n+' - '+p,body:bd})
}).then(function(r){
if(r.ok){msg('预订提交成功! 我们将尽快联系您.','ok');document.getElementById('of').reset();C=[];save();draw()}
else r.json().then(function(d){msg('提交失败: '+d.message,'err')});
b.textContent='提交订单';b.disabled=false
}).catch(function(err){msg('网络错误: '+err.message,'err');b.textContent='提交订单';b.disabled=false})
};

ld();
</script>
</body>
</html>
